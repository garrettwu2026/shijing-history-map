services:
  - type: web
    name: history-map-v3
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: python3 scripts/build-static.py
    staticPublishPath: dist
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*.json
        name: Content-Type
        value: application/json; charset=utf-8
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /app.*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /style.*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data-worker.*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /modules/*.*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
